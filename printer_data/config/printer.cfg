# ============================================================
# Klipper printer.cfg – Artillery Sidewinder X1
# Board   : BigTreeTech SKR 3 (STM32H743 oder STM32H723)
# Probe   : BTT Eddy USB
# Erstellt: 2026
# ============================================================
#
# FIRMWARE KOMPILIEREN (SKR 3):
#   make menuconfig
#   - Micro-controller: STM32
#   - Processor model : STM32H743 (oder STM32H723 je nach Board-Version)
#   - Bootloader      : 128KiB bootloader
#   - Communication   : USB (on PA11/PA12)
#   - Enable "extra low-level configuration options"
#   - GPIO pins to set at micro-controller startup: !PC13
#
# FIRMWARE KOMPILIEREN (BTT Eddy USB):
#   Separates Klipper-Binary für den RP2040 im Eddy erforderlich!
#   make menuconfig
#   - Micro-controller: Raspberry Pi RP2040
#   - Communication   : USB
#   Firmware als klipper_eddy.uf2 flashen (Boot-Knopf gedrückt halten)
#
# SERIELLE ID herausfinden:
#   ls /dev/serial/by-id/
# ============================================================


# ── MCU ─────────────────────────────────────────────────────

[mcu]
# Passe diese ID auf dein Board an!
serial: /dev/serial/by-id/usb-Klipper_stm32h743xx_45001F001651313238353730-if00
restart_method: command

[mcu eddy]
# Passe diese ID auf deinen Eddy an!
serial: /dev/serial/by-id/usb-Klipper_rp2040_504434031033761C-if00


# ── PRINTER ─────────────────────────────────────────────────

[printer]
kinematics: cartesian
max_velocity: 200
max_accel: 3000
max_z_velocity: 30
max_z_accel: 100
square_corner_velocity: 5.0


# ── STEPPER X ───────────────────────────────────────────────

[stepper_x]
step_pin: PD4
dir_pin: PD3
enable_pin: !PD6
microsteps: 16
rotation_distance: 40
endstop_pin: ^!PC1       # X-MIN Endstop (Active Low)
position_endstop: 0
position_min: 0
position_max: 310
homing_speed: 50
homing_retract_dist: 5

[tmc2209 stepper_x]
uart_pin: PD5
run_current: 0.800
stealthchop_threshold: 999999


# ── STEPPER Y ───────────────────────────────────────────────

[stepper_y]
step_pin: PA15
dir_pin: PA8
enable_pin: !PD1
microsteps: 16
rotation_distance: 40
endstop_pin: ^!PC3       # Y-MIN Endstop (Active Low)
position_endstop: 0
position_min: 0
position_max: 310
homing_speed: 50
homing_retract_dist: 5

[tmc2209 stepper_y]
uart_pin: PD0
run_current: 0.800
stealthchop_threshold: 999999


# ── STEPPER Z (Dual Z – Sidewinder X1 hat zwei Z-Motoren) ───

[stepper_z]
step_pin: PE2
dir_pin: !PE3
enable_pin: !PE0
microsteps: 16
rotation_distance: 8        # T8 Trapezspindel
# Eddy als virtueller Z-Endstop:
endstop_pin: probe:z_virtual_endstop
position_min: -5
position_max: 400
homing_speed: 10
second_homing_speed: 3

[tmc2209 stepper_z]
uart_pin: PE1
run_current: 0.800
stealthchop_threshold: 999999

[stepper_z1]
step_pin: PD11
dir_pin: !PD10
enable_pin: !PD13
microsteps: 16
rotation_distance: 8

[tmc2209 stepper_z1]
uart_pin: PD12
run_current: 0.800
stealthchop_threshold: 999999


# ── EXTRUDER ─────────────────────────────────────────────────

[extruder]
step_pin: PD15
dir_pin: PD14
enable_pin: !PC7
microsteps: 16
# Standardwert für Stock-Extruder; nach Kalibrierung anpassen:
rotation_distance: 7.710
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB3
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA2
min_temp: 5
max_temp: 300
min_extrude_temp: 180
max_extrude_only_distance: 500
# PID nach eigenem PID_CALIBRATE ersetzen:
control: pid
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982

[tmc2209 extruder]
uart_pin: PC6
run_current: 0.600
stealthchop_threshold: 999999


# ── HEIZBETT ─────────────────────────────────────────────────

[heater_bed]
heater_pin: PD7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA1
min_temp: 5
max_temp: 150
# PID nach eigenem PID_CALIBRATE ersetzen:
control: pid
pid_Kp: 48.362
pid_Ki: 0.638
pid_Kd: 915.854


# ── LÜFTER ───────────────────────────────────────────────────

[fan]
# Bauteilkühler
pin: PB7

[heater_fan hotend_fan]
pin: PB6
heater: extruder
heater_temp: 50.0
fan_speed: 1.0

[controller_fan board_fan]
pin: PB5
stepper: stepper_x, stepper_y, stepper_z


# ── BTT EDDY USB ──────────────────────────────────────────────
# Eddy ist ein induktiver LDC1612-basierter Wirbelstrom-Sensor.
# Er übernimmt sowohl Probing als auch Z-Homing.

[probe_eddy_current btt_eddy]
sensor_type: ldc1612
i2c_mcu: eddy
i2c_bus: i2c0f
# X/Y-Offset: Abstand des Eddy-Spulenmittelpunkts zur Düse.
# Messe deinen Einbau genau aus!
x_offset: -50.0
y_offset: -8.0
# z_offset wird durch PROBE_EDDY_CURRENT_CALIBRATE gesetzt:
z_offset: 1.0

[temperature_sensor btt_eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy
min_temp: 10
max_temp: 100

[temperature_probe btt_eddy]
# Temperaturkompensation des Eddy-Sensors
sensor_type: Generic 3950
sensor_pin: eddy:gpio26
horizontal_move_z: 2


# ── SAFE Z HOME ──────────────────────────────────────────────

[safe_z_home]
# Mitte des 310×310 Betts:
home_xy_position: 155, 155
speed: 100
z_hop: 10
z_hop_speed: 20


# ── BED MESH ─────────────────────────────────────────────────

[bed_mesh]
speed: 200
horizontal_move_z: 2
# mesh_min = position_min + max(15mm, |offset|)
mesh_min: 30, 30
mesh_max: 280, 300
probe_count: 9, 9
algorithm: bicubic
scan_overshoot: 8      # Für schnelles Scannen mit Eddy


# ── Z-TILT (Dual Z Ausrichtung) ──────────────────────────────

[z_tilt]
# Positionen der beiden Z-Motoren auf der X-Achse:
z_positions:
  0, 155
  310, 155
points:
  30, 155
  280, 155
speed: 100
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.01


# ── SCHRAUBENKORREKTUR ───────────────────────────────────────

[bed_screws]
screw1: 55, 55
screw1_name: Vorne Links
screw2: 255, 55
screw2_name: Vorne Rechts
screw3: 255, 255
screw3_name: Hinten Rechts
screw4: 55, 255
screw4_name: Hinten Links


# ── INPUT SHAPER (optional) ──────────────────────────────────
# Nach Resonanzmessung mit ADXL345 ausfüllen:
#[input_shaper]
#shaper_type_x: mzv
#shaper_freq_x: 0
#shaper_type_y: mzv
#shaper_freq_y: 0


# ── DISPLAY (serielles TFT – nicht von Klipper gesteuert) ────
# Das Original-TFT des SWX1 funktioniert unter Klipper nicht.
# Verwende Mainsail oder Fluidd als Web-Interface.


# ── MACROS ───────────────────────────────────────────────────

[gcode_macro START_PRINT]
description: Druckstart-Macro
gcode:
  {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}

  M104 S{EXTRUDER_TEMP * 0.75}   # Düse vorwärmen (75 %)
  M140 S{BED_TEMP}               # Bett starten

  G90                            # Absolut-Modus
  M82                            # Extruder absolut

  G28                            # Homen

  Z_TILT_ADJUST                  # Dual-Z angleichen
  BED_MESH_CALIBRATE             # Bed Mesh scannen

  G1 X0 Y0 Z5 F5000             # Startposition

  M109 S{EXTRUDER_TEMP}          # Auf Drucktemperatur warten
  M190 S{BED_TEMP}               # Auf Betttemperatur warten

  # Purge-Linie
  G92 E0
  G1 X5 Y5 Z0.3 F3000
  G1 X200 Y5 E15 F1500
  G1 X200 Y5.5
  G1 X5 Y5.5 E30 F1500
  G1 Z3 F3000
  G92 E0

[gcode_macro END_PRINT]
description: Druckende-Macro
gcode:
  M140 S0          # Bett aus
  M104 S0          # Düse aus
  M106 S0          # Lüfter aus
  G91
  G1 X-2 Y-2 E-3 F300   # Kleiner Retract
  G1 Z20 F3000           # Z anheben
  G90
  G1 X0 Y310 F5000       # Druckbett nach vorne
  M84                    # Motoren aus

[gcode_macro PAUSE]
description: Druck pausieren
rename_existing: PAUSE_BASE
gcode:
  PAUSE_BASE
  G91
  G1 Z10 F3000
  G90

[gcode_macro RESUME]
description: Druck fortsetzen
rename_existing: RESUME_BASE
gcode:
  RESUME_BASE

[gcode_macro CANCEL_PRINT]
description: Druck abbrechen
rename_existing: CANCEL_PRINT_BASE
gcode:
  CANCEL_PRINT_BASE
  END_PRINT

[pause_resume]
recover_velocity: 50.0


